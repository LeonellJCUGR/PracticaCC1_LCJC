# =====================================================================
# RutaTicket - API Gateway (NGINX)
#
# Punto de entrada único (north-south) para los clientes:
#   /api/v1/atracciones, /api/v1/temporadas, /api/v1/precios   -> catalog-service
#   /api/v1/reservas, /api/v1/disponibilidad, /api/v1/estadisticas -> booking-service
#   /catalog/...  y  /booking/...  -> acceso directo a cada servicio (Swagger: /catalog/docs, /booking/docs)
#
# Responsabilidades del gateway: enrutado, limitación de peticiones (rate limiting),
# identificador de petición para trazabilidad, cabeceras de seguridad y errores JSON uniformes.
# La comunicación interna booking -> catalog (east-west) NO pasa por el gateway.
# =====================================================================

# Limitación de peticiones por IP del cliente: 20 peticiones/s con ráfagas de 40.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

# No anunciar la versión de NGINX.
server_tokens off;

# Log con el identificador de petición y el servicio que respondió.
log_format gateway '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'rt=$request_time upstream=$upstream_addr request_id=$request_id';

server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log gateway;
    client_max_body_size 1m;

    # DNS interno de Docker: los nombres de servicio se resuelven en tiempo de ejecución,
    # así el gateway arranca aunque un servicio todavía no exista y detecta sus reinicios.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $catalog_service http://catalog-service:8000;
    set $booking_service http://booking-service:8000;

    # ---------- Cabeceras hacia los microservicios ----------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ---------- Cabeceras de respuesta hacia el cliente ----------
    add_header X-Request-ID           $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "no-referrer" always;

    # ---------- Errores uniformes en JSON ----------
    error_page 502 503 504 = @servicio_no_disponible;
    error_page 429 = @demasiadas_peticiones;

    # ---------- Salud del propio gateway ----------
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ---------- Índice de rutas ----------
    location = / {
        default_type application/json;
        return 200 '{"service":"RutaTicket API Gateway","catalog":["/api/v1/atracciones","/api/v1/temporadas","/api/v1/precios"],"booking":["/api/v1/reservas","/api/v1/disponibilidad","/api/v1/estadisticas/ventas"],"docs":["/catalog/docs","/booking/docs"]}';
    }

    # ---------- Enrutado de la API pública ----------
    location ~ ^/api/v1/(atracciones|temporadas|precios)(/|$) {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass $catalog_service;
    }

    location ~ ^/api/v1/(reservas|disponibilidad|estadisticas)(/|$) {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass $booking_service;
    }

    # ---------- Acceso por servicio (documentación y salud) ----------
    # Se elimina el prefijo antes de reenviar: /catalog/docs -> catalog-service /docs
    location /catalog/ {
        limit_req zone=api_limit burst=40 nodelay;
        rewrite ^/catalog/(.*)$ /$1 break;
        proxy_pass $catalog_service;
    }

    location /booking/ {
        limit_req zone=api_limit burst=40 nodelay;
        rewrite ^/booking/(.*)$ /$1 break;
        proxy_pass $booking_service;
    }

    # ---------- Cualquier otra ruta ----------
    location / {
        default_type application/json;
        return 404 '{"error":"RUTA_NO_ENCONTRADA","detalle":"La ruta no existe en el API Gateway"}';
    }

    location @servicio_no_disponible {
        default_type application/json;
        return 503 '{"error":"SERVICIO_NO_DISPONIBLE","detalle":"El microservicio no responde, inténtelo más tarde"}';
    }

    location @demasiadas_peticiones {
        default_type application/json;
        return 429 '{"error":"DEMASIADAS_PETICIONES","detalle":"Se ha superado el límite de peticiones"}';
    }
}
